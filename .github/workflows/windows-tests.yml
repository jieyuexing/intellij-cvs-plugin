name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      JAVA_TOOL_OPTIONS: -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Offline tests
        run: |
          export TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP"
          info=$(find "${GRADLE_USER_HOME:-$HOME/.gradle}" "$USERPROFILE/.gradle" .intellijPlatform -name product-info.json -path '*IU*' 2>/dev/null | head -1)
          if [ -z "$info" ]; then echo "IntelliJ platform not found"; exit 1; fi
          ide=$(cd "$(dirname "$info")" && pwd -W)
          echo "IDE: $ide"
          export CVS_IDEA_LIB="$ide/lib"
          dir=testSource/com/intellij/cvsSupport2
          failed=""
          for t in "$dir"/*_test.py; do
            name=$(basename "$t" .py)
            case "$name" in
              upload_integration_test) echo "skip $name: needs a cvs binary"; continue ;;
              charset_equivalence_test|slru_equivalence_test) args=("$ide") ;;
              *) args=() ;;
            esac
            echo "::group::$name"
            python "$t" "${args[@]}" || failed="$failed $name"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi
