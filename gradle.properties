# Gradle daemon JVM: Java 17+.
# Compiling against IDEA 2026.2 requires Java 25 (platform class file version 69).
# Recommended: use the JBR bundled with IDEA 2026.2.1, e.g.
#   export JAVA_HOME="$HOME/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home"
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# IntelliJ Platform — primary maintainer target (nailed)
# Local install observed: IntelliJ IDEA 2026.2.1 (build 262.9437.22, IU, Preview)
# Build resolves local IDE under ~/Applications or /Applications when version contains 2026.2
platformType=IU
platformVersion=2026.2.1
pluginSinceBuild=262
pluginUntilBuild=262.*

# Plugin coordinates (fork series, not JetBrains 223.0)
pluginGroup=io.github.jieyuexing
pluginName=intellij-cvs-plugin
pluginVersion=1.0.0-SNAPSHOT
