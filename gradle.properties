# Gradle daemon: Java 17+ (Temurin 17 recommended).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Compile classpath: prefer local 2026.2 (source adapted for it).
platformType=IU
platformVersion=2026.2.1

# Install range covers both maintainer IDEs:
#   IU-232.x (IDEA 2023.2.8) … IU-262.* (IDEA 2026.2)
pluginSinceBuild=232
pluginUntilBuild=262.*

# Initial community release; version major tracks the primary train (2026.2 → 262.x).
# All pre-release compatibility, status, rollback, and verification work is folded into 262.0.
pluginGroup=io.github.jieyuexing
pluginName=intellij-cvs-plugin
pluginVersion=262.0.3
