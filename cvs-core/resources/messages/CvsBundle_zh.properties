cvs.local.baseline.confirmation=CVS 工作副本丢失原始时间戳后，无法仅凭本地元数据证明文件内容相同。此操作会在当前项目中信任时间戳不匹配且没有仓库 BaseRevisions 证据的文件内容，并把其哈希与最少量文件元数据保存在 IDE 系统缓存中。\n\n这些文件中已经存在的本地修改也会被一并接受，之后不再显示为更改；与现有 BaseRevision 不同的文件仍会保留为更改。此操作不会连接仓库，也不会修改项目文件。\n\n是否继续？
